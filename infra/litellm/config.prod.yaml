# LiteLLM proxy config for the deployed environments (the shared team proxy and production).
#
# Run by the `litellm` ECS Fargate service - infra/production/litellm.tf. The task gets
# OPENAI_API_KEY and LITELLM_MASTER_KEY from the sentinelchat/litellm Secrets Manager secret;
# the contents of this file are passed in as the LITELLM_CONFIG_YAML env var and written to disk
# by the container entrypoint (see infra/litellm/README.md), so a change here is a
# `terraform apply`, not an image build. The backend reaches the proxy at
# http://litellm.sentinelchat.internal:4000 over Cloud Map private DNS and authenticates with
# the same master key.

model_list:
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  # Master-key-only for now (no key database) - the backend is the only internal consumer and
  # the shared team proxy hands the same key to developers. Add database_url + per-key budgets
  # when there are multiple internal consumers. See infra/litellm/README.md.
  master_key: os.environ/LITELLM_MASTER_KEY
