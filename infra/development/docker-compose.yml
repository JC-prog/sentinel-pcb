# Project name - namespaces every container/network/volume from this stack under "sentinelchat"
# so it never collides with another project's stack (e.g. the older sentinel-pcb PCB app) running
# on the same machine. `docker ps` / `docker volume ls` will show everything prefixed accordingly.
name: sentinelchat

services:
  app:
    build:
      context: ../..
      dockerfile: infra/Dockerfile
    labels:
      project: sentinelchat
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      # Overrides whatever DATABASE_URL is in .env when running under compose, since "db" is
      # only resolvable on the compose network - bare local dev (uv run uvicorn ...) still reads
      # .env's own DATABASE_URL directly (localhost:5433).
      DATABASE_URL: postgresql+asyncpg://sentinelchat:sentinelchat@db:5432/sentinelchat
      # Ollama runs natively on the host (not containerized - see the note below), and inside a
      # container "localhost" means the container itself, not the host - host.docker.internal is
      # the container's route back to the host.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_URL: http://qdrant:6333
      # The LiteLLM proxy runs on the compose network as "litellm" - override .env's
      # localhost:4000 form for this container. Bare `uv run uvicorn` uses .env's value directly.
      OPENAI_BASE_URL: http://litellm:4000/v1
    extra_hosts:
      # host.docker.internal is built into Docker Desktop (Mac/Windows); on Linux it needs this
      # explicit mapping to the host gateway.
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started
      litellm:
        condition: service_healthy

  # Local Postgres for dev. Not used by any application code yet (the chat app is stateless
  # today - see app/settings.py's database_url) - provisioned ahead of the multi-user/auth work
  # this project is heading towards, so it's already there when that lands.
  db:
    image: postgres:16-alpine
    labels:
      project: sentinelchat
    environment:
      POSTGRES_USER: sentinelchat
      POSTGRES_PASSWORD: sentinelchat
      POSTGRES_DB: sentinelchat
    ports:
      - "5433:5432" # host 5433 to avoid clashing with any native local Postgres on 5432
    volumes:
      - sentinelchat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelchat"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Vector store for a future RAG/semantic-search feature - provisioned ahead of need, like "db"
  # above; no application code reads it yet. No official healthcheck here since the image ships
  # neither curl nor wget to probe its own REST API with.
  qdrant:
    image: qdrant/qdrant:latest
    labels:
      project: sentinelchat
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - sentinelchat-qdrant-data:/qdrant/storage

  # LiteLLM proxy - the OpenAI-compatible endpoint the app calls instead of api.openai.com (see
  # infra/litellm/README.md). Part of the default dev stack so local topology matches prod. Put a
  # real provider key in .env as LITELLM_OPENAI_API_KEY for OpenAI calls to actually go through -
  # only this container sees it. Leave it blank to work Ollama-only (calls just 401).
  litellm:
    image: ghcr.io/berriai/litellm:main-stable # pin a versioned -stable tag for real use
    labels:
      project: sentinelchat
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      OPENAI_API_KEY: ${LITELLM_OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-dev}
    volumes:
      - ../litellm/config.dev.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Services below are opt-in via profiles, so you only build/run your slice:
  #   docker compose ... up -d                      # db + qdrant + litellm + app (backend default)
  #   docker compose ... --profile ui up -d         # + the containerized UI
  #   docker compose ... --profile inference up -d  # + the ONNX inference service
  #   docker compose ... --profile full up -d       # everything

  # Full containerized UI for a quick end-to-end smoke test. The primary dev loop is still
  # `npm start` (hot reload) - see README.md.
  ui:
    profiles: ["ui", "full"]
    build:
      context: ../../ui
      dockerfile: Dockerfile
    labels:
      project: sentinelchat
    ports:
      - "4200:80"
    depends_on:
      - app

  # ONNX classification service (inference/). Its image bakes models from Hugging Face at build
  # time, so `inference/models.toml` must have real repos before `--profile inference build`
  # works (see infra/production/README.md). REQUIRE_MODELS_ON_STARTUP=false lets the API boot
  # without every model present.
  inference:
    profiles: ["inference", "full"]
    build:
      context: ../../inference
      dockerfile: Dockerfile
    labels:
      project: sentinelchat
    ports:
      - "8001:8001"
    environment:
      LOG_FORMAT: json
      REQUIRE_MODELS_ON_STARTUP: "false"

volumes:
  sentinelchat-db-data:
  sentinelchat-qdrant-data:
