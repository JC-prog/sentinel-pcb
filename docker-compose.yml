name: sentinelpcb

services:
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - ollama

  # Local/offline reasoning fallback + cheap dev iteration without spending API credits.
  # Postgres (+pgvector) and Redis are Supabase/Upstash-hosted, not containerized here.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # Mapped to the same :4200 the Angular dev server uses, so the backend's default
  # cors_allow_origins (app/settings.py) works unchanged in both dev and this compose setup.
  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - app

volumes:
  ollama-data:
