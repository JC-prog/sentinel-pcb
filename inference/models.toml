# Deployable classification models. One [[models]] block per model the service loads.
#
# scripts/fetch_models.py reads this at image build time and downloads each `filename` from the
# Hugging Face repo into <model_store_dir>/<name>.onnx. The running service reads the same file
# for labels and preprocessing.
#
# `name` is what callers send in the request's "model" field, so keep it short and stable. Pin
# `revision` to a commit SHA (not "main") once a model is settled, so rebuilds are reproducible.
#
# Models are at https://huggingface.co/JcProg - this is the two-stage PCB ADC (Automated Defect
# Classification) pipeline: pcb_region picks the component region (Body/Lead/Text), then the
# matching pcb_*_defect model classifies the actual defect. See
# app/agents/adc_inspection_agent/graph.py for the caller that chains them.

[[models]]
name = "pcb_region"
repo_id = "JcProg/PCBInspect-Region"
revision = "main"
filename = "model.onnx"
labels = ["Body", "Lead", "Text"]
input_size = [224, 224]        # [height, width]
layout = "NCHW"
color = "RGB"
mean = [0.0, 0.0, 0.0]          # model normalizes by /255 only, no channel mean/std subtraction
std = [1.0, 1.0, 1.0]
apply_softmax = true            # model outputs raw logits

[[models]]
name = "pcb_body_defect"
repo_id = "JcProg/PCBInspect-BodyDefect"
revision = "main"
filename = "model.onnx"
labels = ["ForeignMaterial", "Golden", "MissingPart", "Shift", "Tombstone", "WrongPart"]
input_size = [640, 640]
layout = "NCHW"
color = "RGB"
mean = [0.0, 0.0, 0.0]
std = [1.0, 1.0, 1.0]
apply_softmax = true

[[models]]
name = "pcb_lead_defect"
repo_id = "JcProg/PCBInspect-LeadDefect"
revision = "main"
filename = "model.onnx"
labels = ["Golden", "SolderInsufficient"]
input_size = [640, 640]
layout = "NCHW"
color = "RGB"
mean = [0.0, 0.0, 0.0]
std = [1.0, 1.0, 1.0]
apply_softmax = true

[[models]]
name = "pcb_text_defect"
repo_id = "JcProg/PCBInspect-TextDefect"
revision = "main"
filename = "model.onnx"
labels = ["Golden", "WrongPart"]
input_size = [480, 480]
layout = "NCHW"
color = "RGB"
mean = [0.0, 0.0, 0.0]
std = [1.0, 1.0, 1.0]
apply_softmax = true
