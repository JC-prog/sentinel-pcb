[project]
name = "sentinel-chat"
version = "0.8.0"
description = "FastAPI backend for the SentinelChat UI - SSE chat streaming and image uploads."
authors = [
    { name = "JC-Prog", email = "jeffrey.chong28@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langfuse>=4.15.4",
    "langgraph>=1.2.11",
    "numpy>=2.5.2",
    "openai>=3.8.0",
    "opencv-python-headless>=4.9",
    "pandas>=2.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.11.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
# inference/ is a separate service with its own pyproject, venv, and CI job - it must not be
# linted or type-checked against this project's dependency set. app/agents/orchestrator_agent/ is
# a close port of orchestrator-agent/adc_agentic_project, an external project someone else
# maintains - kept close to that project's own (untyped, unlinted) source rather than reformatted
# to this repo's conventions, so a diff against upstream stays legible.
extend-exclude = ["inference", "app/agents/orchestrator_agent"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ['^inference/']

# app/agents/orchestrator_agent/ is a close port of orchestrator-agent/adc_agentic_project, an
# external project someone else maintains - kept close to that project's own (untyped) source
# rather than reformatted to this repo's strict-typing convention, so a diff against upstream
# stays legible. Unlike inference/, app/main.py imports directly from this package, so a plain
# `exclude` wouldn't stop mypy from still following those imports and type-checking it anyway -
# `ignore_errors` is the mypy-recommended way to silence a specific package while still being
# importable from typed code.
[[tool.mypy.overrides]]
module = "app.agents.orchestrator_agent.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
