<aside
  class="flex h-full w-64 shrink-0 flex-col border-r border-slate-200 bg-white text-slate-700 dark:border-slate-800 dark:bg-slate-950 dark:text-slate-200"
>
  <div class="p-3">
    <a
      routerLink="/"
      class="flex w-full items-center gap-2 rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800"
    >
      <span class="text-lg leading-none">+</span>
      New chat
    </a>
  </div>

  <nav class="flex-1 overflow-y-auto px-2 pb-3">
    @if (conversations().length === 0) {
      <p class="px-2 py-4 text-sm text-slate-400 dark:text-slate-500">No conversations yet.</p>
    }
    <ul class="flex flex-col gap-1">
      @for (conversation of conversations(); track conversation.id) {
        <li>
          <a
            [routerLink]="['/c', conversation.id]"
            class="group flex items-center justify-between gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
            [class]="isActive(conversation.id) ? 'bg-slate-100 dark:bg-slate-800' : ''"
          >
            <span class="truncate">{{ conversation.title }}</span>
            <button
              type="button"
              class="shrink-0 rounded p-1 text-slate-400 opacity-0 hover:bg-slate-200 hover:text-slate-700 group-hover:opacity-100 dark:text-slate-500 dark:hover:bg-slate-700 dark:hover:text-slate-200"
              aria-label="Delete conversation"
              (click)="deleteConversation($event, conversation.id)"
            >
              ✕
            </button>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="flex flex-col gap-1 border-t border-slate-200 p-3 dark:border-slate-800">
    <button
      type="button"
      class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
      (click)="themeService.toggle()"
    >
      @if (themeService.theme() === 'dark') {
        <span>☀️</span>
        <span>Light mode</span>
      } @else {
        <span>🌙</span>
        <span>Dark mode</span>
      }
    </button>
    <button
      type="button"
      class="flex w-full items-center gap-2 rounded-lg px-3 py-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-800"
      (click)="settingsService.open()"
    >
      <span>⚙️</span>
      <span>Settings</span>
    </button>

    @if (authService.currentUser(); as user) {
      <div class="mt-1 flex items-center justify-between gap-2 border-t border-slate-200 pt-2 dark:border-slate-800">
        <div class="min-w-0">
          <p class="truncate text-sm font-medium">{{ user.username }}</p>
          <p class="truncate text-xs text-slate-500 uppercase dark:text-slate-400">{{ user.role }}</p>
        </div>
        <button
          type="button"
          class="shrink-0 rounded-lg px-2 py-1 text-xs text-slate-500 hover:bg-slate-100 hover:text-slate-700 dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
          (click)="logout()"
        >
          Log out
        </button>
      </div>
    }
  </div>
</aside>
