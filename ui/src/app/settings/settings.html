<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/40"
  (click)="settingsService.close()"
>
  <div
    class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 text-slate-900 shadow-xl dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100"
    (click)="$event.stopPropagation()"
  >
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-lg font-semibold">Settings</h2>
      <button
        type="button"
        class="rounded p-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700 dark:hover:bg-slate-800 dark:hover:text-slate-200"
        aria-label="Close settings"
        (click)="settingsService.close()"
      >
        ✕
      </button>
    </div>

    <p class="mb-2 text-sm font-medium text-slate-700 dark:text-slate-300">Model</p>
    <div class="mb-4 flex flex-col gap-2">
      <button
        type="button"
        class="rounded-lg border px-3 py-2 text-left text-sm"
        [class]="
          settingsService.provider() === 'ollama'
            ? 'border-slate-900 dark:border-slate-100'
            : 'border-slate-300 dark:border-slate-700'
        "
        (click)="selectProvider('ollama')"
      >
        Local LLM (Ollama)
      </button>
      <button
        type="button"
        class="rounded-lg border px-3 py-2 text-left text-sm"
        [class]="
          settingsService.provider() === 'openai'
            ? 'border-slate-900 dark:border-slate-100'
            : 'border-slate-300 dark:border-slate-700'
        "
        (click)="selectProvider('openai')"
      >
        OpenAI (API key)
      </button>
    </div>

    @if (settingsService.provider() === 'openai') {
      <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="openai-api-key">
        OpenAI API key
      </label>
      <input
        id="openai-api-key"
        type="password"
        autocomplete="off"
        class="mb-1 w-full rounded-lg border border-slate-300 bg-transparent px-3 py-2 text-sm outline-none dark:border-slate-700"
        placeholder="sk-…"
        [ngModel]="settingsService.openaiApiKey()"
        (ngModelChange)="onApiKeyChange($event)"
      />
      <p class="text-xs text-slate-500 dark:text-slate-400">
        Stored only in this browser and sent with each message - never saved on the server.
      </p>
    }
  </div>
</div>
