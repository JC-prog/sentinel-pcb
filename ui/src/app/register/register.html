<div
  class="flex min-h-screen w-screen items-center justify-center bg-white text-slate-900 dark:bg-slate-900 dark:text-slate-100"
>
  <form
    class="w-full max-w-sm rounded-2xl border border-slate-200 p-6 dark:border-slate-800"
    (ngSubmit)="submit()"
  >
    <div class="mb-6 flex flex-col items-center gap-2">
      <svg viewBox="0 0 24 24" class="h-10 w-10 shrink-0" aria-hidden="true">
        <path d="M4 4 L20 4 L20 12 L12 22 L4 12 Z" class="fill-slate-900 dark:fill-slate-100" />
        <g class="fill-none stroke-cyan-500" stroke-width="1.1" stroke-linecap="round">
          <path d="M12 10 V6 M10 12 H6 M14 12 H18 M12 14 V17.5" />
        </g>
        <g class="fill-cyan-500">
          <rect x="10" y="10" width="4" height="4" rx="0.5" />
          <circle cx="12" cy="6" r="0.9" />
          <circle cx="6" cy="12" r="0.9" />
          <circle cx="18" cy="12" r="0.9" />
          <circle cx="12" cy="17.5" r="0.9" />
        </g>
      </svg>
      <p class="text-sm font-semibold tracking-tight text-slate-500 dark:text-slate-400">SentinelChat</p>
      <h1 class="text-xl font-semibold">Register</h1>
    </div>

    @if (error()) {
      <p class="mb-4 rounded-lg bg-rose-100 px-3 py-2 text-sm text-rose-700 dark:bg-rose-950 dark:text-rose-300">
        {{ error() }}
      </p>
    }

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="username">Username</label>
    <input
      id="username"
      required
      autocomplete="username"
      class="mb-4 w-full rounded-lg border border-slate-300 bg-transparent px-3 py-2 text-sm outline-none dark:border-slate-700"
      [ngModel]="username()"
      (ngModelChange)="username.set($event)"
      name="username"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="email">Email</label>
    <input
      id="email"
      type="email"
      required
      autocomplete="email"
      class="mb-4 w-full rounded-lg border border-slate-300 bg-transparent px-3 py-2 text-sm outline-none dark:border-slate-700"
      [ngModel]="email()"
      (ngModelChange)="email.set($event)"
      name="email"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="password">Password</label>
    <input
      id="password"
      type="password"
      required
      autocomplete="new-password"
      class="mb-4 w-full rounded-lg border border-slate-300 bg-transparent px-3 py-2 text-sm outline-none dark:border-slate-700"
      [ngModel]="password()"
      (ngModelChange)="password.set($event)"
      name="password"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="employee-id">
      Employee ID
    </label>
    <input
      id="employee-id"
      required
      class="mb-4 w-full rounded-lg border border-slate-300 bg-transparent px-3 py-2 text-sm outline-none dark:border-slate-700"
      [ngModel]="employeeId()"
      (ngModelChange)="employeeId.set($event)"
      name="employeeId"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="department-shift">
      Department / shift
    </label>
    <input
      id="department-shift"
      required
      placeholder="e.g. QA Day Shift"
      class="mb-4 w-full rounded-lg border border-slate-300 bg-transparent px-3 py-2 text-sm outline-none dark:border-slate-700"
      [ngModel]="departmentShift()"
      (ngModelChange)="departmentShift.set($event)"
      name="departmentShift"
    />

    <label class="mb-1 block text-sm font-medium text-slate-700 dark:text-slate-300" for="role">Role</label>
    <select
      id="role"
      class="mb-6 w-full rounded-lg border border-slate-300 bg-transparent px-3 py-2 text-sm outline-none dark:border-slate-700"
      [ngModel]="role()"
      (ngModelChange)="role.set($event)"
      name="role"
    >
      <option value="qa">QA</option>
      <option value="operator">Operator</option>
      <option value="admin">Admin</option>
    </select>

    <button
      type="submit"
      [disabled]="submitting()"
      class="mb-4 w-full rounded-lg bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white"
    >
      {{ submitting() ? 'Creating account…' : 'Register' }}
    </button>

    <p class="text-center text-sm text-slate-500 dark:text-slate-400">
      Already have an account? <a routerLink="/login" class="underline">Log in</a>
    </p>
  </form>
</div>
