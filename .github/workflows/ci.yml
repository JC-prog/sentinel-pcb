name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    name: Stage 1 — static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy .

  tests:
    name: Stage 2 — unit + agent-behaviour tests
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run pytest

  # Stages 3-5 (prompt/eval regression, AI red-team, guardrail/schema tests) are added once the
  # first reasoning agent exists (Dataset Preparation, Sprint 2) — see
  # ../../../pcb-ai-agent/Process and Planning/CICD-methodology.md §2.
