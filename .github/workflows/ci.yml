name: CI

on:
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # uv provisions the Python version itself (pyproject.toml's requires-python) - no separate
      # actions/setup-python step needed.
      - run: uv sync

      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q

  frontend:
    name: Frontend (ng test, ng build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
